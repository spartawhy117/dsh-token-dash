<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>API 用量卡状态全量</title>
<style>
  :root { /*__SPEC_CSS__*/ }
  /*__BASE_CSS__*/
</style>
</head>
<body>
<div class="page">
  <section>
    <h2>API 用量卡状态全量：normal / warn / over / 预算未设置 / 余额不支持（右侧可改月度预算，环与计划余额即时重算）</h2>
    <div class="grid api" id="cards"></div>
  </section>
</div>

<script>
  window.__SPEC__ = /*__SPEC_JSON__*/
</script>
<script>
/*__RING_JS__*/
</script>
<script>
  const A = window.__SPEC__.apiGauge

  const cards = [
    { name: 'OpenRouter', cur: '$', used: 19, budget: '50.00', real: '$7.66', month: '$22.80' },
    { name: 'DeepSeek', cur: '¥', used: 91.9, budget: '100.00', real: '¥87.66', month: '¥91.90' },
    { name: '通义千问', cur: '¥', used: 6.43, budget: '5.00', real: '—', month: '¥6.43' },
    { name: 'Kimi API', cur: '¥', used: 0, budget: '', real: '¥12.00', month: '¥3.20' },
    { name: 'GLM API', cur: '¥', used: 6, budget: '50.00', real: '—', month: '¥6.00' },
  ]

  const money = (cur, value) => value < 0 ? `-${cur}${Math.abs(value).toFixed(2)}` : `${cur}${value.toFixed(2)}`

  const cardHtml = (data, index) => `
    <div class="cell">
      <div class="card" data-index="${index}">
        <div class="head"><span class="name">${data.name}</span><span class="chip">[ API 用量 ]</span></div>
        <div class="api-body">
          <div class="gauge">
            <div class="ring">${ringSvg(A.ring, A.stroke, null, 'empty')}<span class="ring-label">${A.label}</span></div>
            <div class="pct empty" data-role="pct">—</div>
          </div>
          <label class="budget">
            <span class="k">月度预算</span>
            <span class="budget-input">
              <span class="cur">${data.cur}</span>
              <input data-role="budget" inputmode="decimal" value="${data.budget}" placeholder="未设置" />
            </span>
          </label>
        </div>
        <div class="kv"><span class="k">计划余额</span><span class="v" data-role="plan">—</span></div>
        <div class="kv"><span class="k">真实余额</span><span class="v">${data.real}</span></div>
        <div class="kv"><span class="k">本月已花</span><span class="v">${data.month}</span></div>
      </div>
      <span class="cap" data-role="cap"></span>
    </div>`

  const update = (index) => {
    const data = cards[index]
    const card = document.querySelector(`.card[data-index="${index}"]`)
    const raw = card.querySelector('[data-role=budget]').value.replace(/[^\d.]/g, '')
    const budget = raw === '' ? null : Number(raw)
    const percent = budget === null || budget <= 0 ? null : (data.used / budget) * 100
    const state = ringStateOf(percent, window.__SPEC__.ring.criticalApi)

    card.querySelector('.ring').innerHTML = `${ringSvg(A.ring, A.stroke, percent, state)}<span class="ring-label">${A.label}</span>`
    const pct = card.querySelector('[data-role=pct]')
    pct.className = `pct ${state}`
    pct.textContent = percent === null ? '—' : `${percent.toFixed(1)}%`

    const plan = card.querySelector('[data-role=plan]')
    const planValue = budget === null || budget <= 0 ? null : budget - data.used
    plan.textContent = planValue === null ? '—' : money(data.cur, planValue)
    plan.className = `v${planValue !== null && planValue < 0 ? ' over' : ''}`

    const cap = card.parentElement.querySelector('[data-role=cap]')
    cap.textContent = state === 'empty'
      ? '预算未设置'
      : `${state} · ${percent.toFixed(1)}%`
  }

  document.getElementById('cards').innerHTML = cards.map((data, index) => cardHtml(data, index)).join('')
  cards.forEach((_, index) => {
    const input = document.querySelector(`.card[data-index="${index}"] [data-role=budget]`)
    input.addEventListener('input', () => update(index))
    update(index)
  })
</script>
</body>
</html>
