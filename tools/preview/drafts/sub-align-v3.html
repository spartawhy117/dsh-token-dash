<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>P2 订阅窗口 · 对齐方案 v3</title>
<style>
  :root { /*__SPEC_CSS__*/ }
  /*__BASE_CSS__*/
  body { padding: 24px; font-family: system-ui; }
  .page { display: flex; flex-direction: column; gap: 24px; max-width: 900px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .note { font-size: 11px; color: var(--weak); margin: 4px 0 10px; line-height: 1.6; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .col-wrap { display: flex; flex-direction: column; gap: 8px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; align-self: flex-start; }
  .tag.cur { color: #f0a35e; border: 1px solid color-mix(in srgb,#f0a35e 40%,transparent); }
  .tag.new { color: #6fbf73; border: 1px solid color-mix(in srgb,#6fbf73 40%,transparent); }

  .panel { width: 380px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ph { display: flex; align-items: center; justify-content: space-between; }
  .ph .t { font-size: 13px; font-weight: 600; }
  .ph .acts { display: flex; gap: 4px; }
  .ph .acts span { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent); border: 1px solid color-mix(in srgb,var(--accent) 32%,transparent); background: color-mix(in srgb,var(--accent) 16%,transparent); }
  .sub-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .sub-head .name { font-weight: 600; }
  .sub-head .chip { font-size: 11px; color: var(--muted); }

  .windows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .win { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .win:nth-child(1) { justify-self: start; align-items: flex-start; }
  .win:nth-child(2) { justify-self: center; align-items: center; }
  .win:nth-child(3) { justify-self: end; align-items: flex-end; }
  .top { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .k { font-size: 11px; color: var(--muted); }
  .inline { display: inline-flex; align-items: center; gap: 4px; }
  .inline b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta { font-size: 11px; color: var(--weak); white-space: nowrap; }

  /* 当前：倒计时以环心居中，宽于环时溢出 */
  .cur .rel { display: inline-block; padding-left: 0; transform: translateX(0); }
  /* 新方案：整组按列对齐，倒计时与环左缘齐平 */
  .fix .rel { padding-left: 0; }
  /* 变体：倒计时整体右移、与百分比右缘齐平 */
  .fix2 .rel { align-self: flex-end; }
</style></head><body>
<div class="page">
<section>
  <h2>P2 订阅窗口 · 倒计时对齐修正</h2>
  <p class="note">列框本身已正确右对齐（实测 383 vs 384，差 1px）。视觉上的“不齐”来自倒计时：它按圆环中心居中，而文字比圆环宽，右侧溢出列外，把整组重心拉偏。</p>
  <div class="row" id="stage"></div>
</section>
</div>
<script>window.__SPEC__ = /*__SPEC_JSON__*/</script>
<script>/*__RING_JS__*/</script>
<script>
  const { p2, criticalSub } = window.__SPEC__.ring
  const ws = [{key:'5h',pct:5,rel:'1 小时后'},{key:'周',pct:2,rel:'6 天后'},{key:'月',pct:99,rel:'5 天后'}]
  const inline = (pct) => { const st = ringStateOf(pct, criticalSub); return `<span class="inline">${ringSvg(p2.size,p2.stroke,pct,st)}<b class="pct ${st}">${pct.toFixed(1)}%</b></span>` }
  const win = (w) => `<span class="win"><span class="top"><span class="k">${w.key}</span>${inline(w.pct)}</span><span class="meta rel">${w.rel}</span></span>`
  const panel = (title, cls, tagCls) => `<div class="col-wrap"><span class="tag ${tagCls}">${title}</span><div class="panel"><div class="ph"><span class="t">当前模型</span><span class="acts"><span>↻</span><span>✕</span></span></div><div class="sub-head"><span class="name">OpenCode Go</span><span class="chip">[ 订阅 ]</span></div><div class="windows ${cls}">${ws.map(win).join('')}</div></div></div>`
  document.getElementById('stage').innerHTML =
    panel('当前：倒计时环心居中', 'cur', 'cur') + panel('新方案：倒计时随列对齐', 'fix', 'new')
</script></body></html>
