<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>P2 订阅窗口 · 横排方案（C 方向）</title>
<style>
  :root { /*__SPEC_CSS__*/ }
  /*__BASE_CSS__*/
  body { padding: 24px; font-family: system-ui; }
  .page { display: flex; flex-direction: column; gap: 28px; max-width: 1000px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .note { font-size: 11px; color: var(--weak); margin: 4px 0 10px; line-height: 1.7; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .cw { display: flex; flex-direction: column; gap: 8px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; align-self: flex-start; }
  .tag.cur { color: #f0a35e; border: 1px solid color-mix(in srgb,#f0a35e 40%,transparent); }
  .tag.new { color: #6fbf73; border: 1px solid color-mix(in srgb,#6fbf73 40%,transparent); }
  .hint { font-size: 10px; color: var(--weak); align-self: flex-start; }

  .panel { width: 380px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ph { display: flex; align-items: center; justify-content: space-between; }
  .ph .t { font-size: 13px; font-weight: 600; }
  .ph .acts { display: flex; gap: 4px; }
  .ph .acts span { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent); border: 1px solid color-mix(in srgb,var(--accent) 32%,transparent); background: color-mix(in srgb,var(--accent) 16%,transparent); }
  .sub-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .sub-head .name { font-weight: 600; }
  .sub-head .chip { font-size: 11px; color: var(--muted); }

  /* 现状：两行三列 */
  .v-old { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
  .v-old .win { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .v-old .win:nth-child(1) { justify-self: start; align-items: flex-start; }
  .v-old .win:nth-child(2) { justify-self: center; align-items: center; }
  .v-old .win:nth-child(3) { justify-self: end; align-items: flex-end; }
  .top { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .k { font-size: 11px; color: var(--muted); }
  .inline { display: inline-flex; align-items: center; gap: 4px; }
  .inline b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta { font-size: 11px; color: var(--weak); white-space: nowrap; }

  /* C-1：整组横排，组间 · 分隔（等同 P1） */
  .v-c1 { display: flex; flex-wrap: wrap; align-items: center; gap: 0; }
  .v-c1 .seg { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .v-c1 .sep { color: var(--weak); padding: 0 8px; }

  /* C-2：整组横排，但均分三列 + 组内居中（left/center/right 依列定） */
  .v-c2 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
  .v-c2 .seg { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; min-width: 0; }
  .v-c2 .seg:nth-child(1) { justify-self: start; }
  .v-c2 .seg:nth-child(2) { justify-self: center; }
  .v-c2 .seg:nth-child(3) { justify-self: end; }

  /* C-3：两行显示 —— 第一行三组横排，时间单独一行 */
  .v-c3 .line { display: flex; flex-wrap: nowrap; align-items: center; gap: 0; overflow: hidden; }
  .v-c3 .seg { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .v-c3 .sep { color: var(--weak); padding: 0 6px; }

  .measure { font-size: 10px; color: #f0a35e; font-family: monospace; white-space: pre; line-height: 1.5; }
</style></head><body>
<div class="page">
<section>
  <h2>方向 C：整组横排（时间-环-数字 视为一个整体）</h2>
  <p class="note">每个窗口 = 「标签 · 环 · 数字 · 时间」一个不可分割的组。组内不拆行，组间用 · 分隔（同 P1）。<br>下方给出三种组间分布方式，并实测 380px 是否装得下。</p>
  <div class="row" id="stage"></div>
</section>
<div class="measure" id="m"></div>
</div>
<script>window.__SPEC__ = /*__SPEC_JSON__*/</script>
<script>/*__RING_JS__*/</script>
<script>
  const { p2, criticalSub } = window.__SPEC__.ring
  const ws = [{key:'5h',pct:5,rel:'1 小时后'},{key:'周',pct:2,rel:'6 天后'},{key:'月',pct:99,rel:'5 天后'}]
  const inline = (pct) => { const st = ringStateOf(pct, criticalSub); return `<span class="inline">${ringSvg(p2.size,p2.stroke,pct,st)}<b class="pct ${st}">${pct.toFixed(1)}%</b></span>` }
  const seg = (w) => `<span class="seg"><span class="k">${w.key}</span>${inline(w.pct)}<span class="meta">${w.rel}</span></span>`
  const sep = '<span class="sep">·</span>'

  const oldPanel = `<div class="cw"><span class="tag cur">现状（两行三列）</span><div class="panel"><div class="ph"><span class="t">当前模型</span><span class="acts"><span>↻</span><span>✕</span></span></div><div class="sub-head"><span class="name">OpenCode Go</span><span class="chip">[ 订阅 ]</span></div><div class="v-old">${ws.map(w => `<span class="win"><span class="top"><span class="k">${w.key}</span>${inline(w.pct)}</span><span class="meta">${w.rel}</span></span>`).join('')}</div></div></div>`

  const c1 = `<div class="cw"><span class="tag new">C-1 横排 + · 分隔</span><div class="panel"><div class="ph"><span class="t">当前模型</span><span class="acts"><span>↻</span><span>✕</span></span></div><div class="sub-head"><span class="name">OpenCode Go</span><span class="chip">[ 订阅 ]</span></div><div class="v-c1">${ws.map(seg).join(sep)}</div></div></div>`

  const c2 = `<div class="cw"><span class="tag new">C-2 横排 + 三列均分（左/中/右）</span><div class="panel"><div class="ph"><span class="t">当前模型</span><span class="acts"><span>↻</span><span>✕</span></span></div><div class="sub-head"><span class="name">OpenCode Go</span><span class="chip">[ 订阅 ]</span></div><div class="v-c2">${ws.map(seg).join('')}</div></div></div>`

  document.getElementById('stage').innerHTML = oldPanel + c1 + c2
  requestAnimationFrame(() => {
    const panelW = 348  // 380 - 2*16 padding
    const segs = document.querySelectorAll('.v-c1 .seg')
    let total = 0
    segs.forEach(s => total += s.getBoundingClientRect().width)
    const sepW = [...document.querySelectorAll('.v-c1 .sep')].reduce((a, s) => a + s.getBoundingClientRect().width, 0)
    const m = []
    m.push('P2 内容宽 = ' + panelW + 'px')
    m.push('三个整组宽度 = ' + segs.length + ' 组，合计 ' + total.toFixed(1) + 'px')
    m.push('两个分隔符合计 ' + sepW.toFixed(1) + 'px')
    m.push('横排总需求 = ' + (total + sepW).toFixed(1) + 'px')
    m.push((total + sepW) <= panelW ? '✅ 装得下，剩余 ' + (panelW - total - sepW).toFixed(1) + 'px' : '❌ 超出 ' + (total + sepW - panelW).toFixed(1) + 'px')
    document.getElementById('m').textContent = m.join('\n')
  })
</script></body></html>
