<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>成本柱双轴方案预览</title>
<style>
  :root { /*__SPEC_CSS__*/ }
  /*__BASE_CSS__*/
  .trend { margin-top: 8px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .title { font-size: 13px; font-weight: 600; }
  .hint { font-size: 11px; color: var(--weak); }
  .spacer { flex: 1 1 auto; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-right: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; margin-right: 3px; }
  .pill { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(127,127,127,.12); }
  .pill span { padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--muted); }
  .pill span.on { background: rgba(255,255,255,.92); color: #1c1c1e; font-weight: 600; }
  .plot { display: grid; grid-template-columns: auto 1fr auto; align-items: stretch; }
  .axis { position: relative; height: calc(132px + 18px); font-size: 11px; color: var(--weak); font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; transform: translateY(-50%); white-space: nowrap; }
  .axis.left { min-width: 48px; }
  .axis.right { min-width: 42px; }
  .axis.left span { right: 6px; }
  .axis.right span { left: 6px; }
  .area { position: relative; height: calc(132px + 18px); }
  .grid { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, currentColor 12%, transparent); }
  .bars { position: absolute; inset: 0 0 18px 0; display: flex; align-items: flex-end; gap: 2px; }
  .slot { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; gap: 1px; }
  .bar { flex: 1 1 0; border-radius: 3px 3px 0 0; }
  .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: flex; align-items: center; gap: 2px; font-size: 11px; color: var(--weak); }
  .ticks span { flex: 1 1 0; text-align: center; white-space: nowrap; }
  .blocked { position: absolute; inset: 0 0 18px 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .note { font-size: 11px; color: var(--weak); margin-top: 8px; }
</style>
</head>
<body>
<div class="page">
  <section>
    <h2>现状：多币种 → 整块禁用</h2>
    <div class="trend">
      <div class="head">
        <span class="title">使用趋势 · 费用</span><span class="hint">按天</span><span class="spacer"></span>
        <span class="pill"><span>Tokens</span><span class="on">费用</span><span>命中率</span><span>请求</span></span>
      </div>
      <div class="plot" style="grid-template-columns: 44px 1fr">
        <div class="axis left"></div>
        <div class="area" id="blocked-area"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>改后：两个币种 → 两根柱 + 左右各一条轴（同一套刻度算法）</h2>
    <div class="trend">
      <div class="head">
        <span class="title">使用趋势 · 费用</span><span class="hint">按天</span><span class="spacer"></span>
        <span class="legend"><i class="dot" style="background:#6ea8ff"></i>¥ CNY<i class="dot" style="background:#c9a5ff;margin-left:8px"></i>$ USD</span>
        <span class="pill"><span>Tokens</span><span class="on">费用</span><span>命中率</span><span>请求</span></span>
      </div>
      <div class="plot">
        <div class="axis left" id="axis-left"></div>
        <div class="area" id="area"></div>
        <div class="axis right" id="axis-right"></div>
      </div>
      <div class="note">左右轴调用同一个 trendAxisTicks：上限取各自数据最大值，中档取中点，下限为 0 时不显示底部档；金额一律两位小数。归一也各自独立。</div>
    </div>
  </section>
</div>

<script>window.__SPEC__ = /*__SPEC_JSON__*/</script>
<script>/*__RING_JS__*/</script>
<script>
  const DAYS = []
  DAYS.push('10-31')
  for (let d = 1; d <= 20; d += 1) DAYS.push('11-' + String(d).padStart(2, '0'))

  const CNY = DAYS.map((day) => {
    if (day === '11-16') return 18.71
    if (day === '11-19') return 20.3
    if (day === '11-20') return 3.07
    if (day === '11-09') return 2.96
    if (day === '11-01') return 1.9
    return 0
  })
  const USD = DAYS.map((day) => {
    if (day === '11-19') return 0.58
    if (day === '11-20') return 0.57
    if (day === '11-16') return 0.42
    if (day === '11-09') return 0.03
    return 0
  })

  // 与 client.js · fmtMoney / trendAxisTicks 同实现
  const fmtMoney = (value, currency) => (currency === 'USD' ? '$' : '¥') + (Number(value) || 0).toFixed(2)
  const trendAxisTicks = (max, currency) => [
    { key: 'top', pct: 100, text: fmtMoney(max, currency) },
    { key: 'mid', pct: 50, text: fmtMoney(max / 2, currency) },
  ]

  const renderAxis = (node, ticks) => {
    node.innerHTML = ticks.map((tick) => {
      const top = tick.pct === 100 ? '0px' : 'calc((100% - 18px) * 0.5)'
      return '<span style="top:' + top + '">' + tick.text + '</span>'
    }).join('')
  }

  const cnyMax = Math.max(...CNY)
  const usdMax = Math.max(...USD)
  renderAxis(document.getElementById('axis-left'), trendAxisTicks(cnyMax, 'CNY'))
  renderAxis(document.getElementById('axis-right'), trendAxisTicks(usdMax, 'USD'))

  const gridHtml = [100, 50, 0].map((pct) =>
    '<span class="grid" style="top:calc((100% - 18px) * ' + (1 - pct / 100) + ')"></span>').join('')
  const tickHtml = '<div class="ticks">' + DAYS.map((d, i) =>
    '<span>' + (i % 3 === 0 || i === DAYS.length - 1 ? d : '') + '</span>').join('') + '</div>'

  document.getElementById('blocked-area').innerHTML =
    gridHtml + '<div class="blocked">多币种下成本柱不可用，请切换其他指标</div>' + tickHtml

  const slots = DAYS.map((day, i) => {
    const hCny = CNY[i] <= 0 ? 0 : Math.max(2, (CNY[i] / cnyMax) * 100)
    const hUsd = USD[i] <= 0 ? 0 : Math.max(2, (USD[i] / usdMax) * 100)
    return '<div class="slot" title="' + day + ' · ¥' + CNY[i].toFixed(2) + ' · $' + USD[i].toFixed(2) + '">'
      + '<div class="bar" style="height:' + hCny + '%;background:' + (hCny === 0 ? 'transparent' : '#6ea8ff') + '"></div>'
      + '<div class="bar" style="height:' + hUsd + '%;background:' + (hUsd === 0 ? 'transparent' : '#c9a5ff') + '"></div>'
      + '</div>'
  }).join('')

  document.getElementById('area').innerHTML =
    gridHtml + '<div class="bars">' + slots + '</div>' + tickHtml
</script>
</body>
</html>
